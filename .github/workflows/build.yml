name: Release

on:
  push:
    branches:
      - '**'
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g. v1.0.0)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-sign-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Verify Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          ls "$ANDROID_HOME" | head -n 20 || true
          find "$ANDROID_HOME/build-tools" -maxdepth 1 -type d | sort -V | tail -n 3 || true

      - name: Accept Android SDK licenses
        run: |
          SDKMANAGER=$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | sort -V | tail -n 1)
          echo "Using: $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null || true

      - name: Grant execute on gradlew
        run: chmod +x gradlew

      - name: Decode keystore
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Build unsigned release APK
        run: ./gradlew assembleRelease --no-daemon

      - name: Locate unsigned APK
        id: locate
        run: |
          APK=$(find app/build/outputs/apk/release -name '*.apk' | head -n 1)
          if [ -z "$APK" ]; then
            echo "No APK found in app/build/outputs/apk/release"
            ls -la app/build/outputs/apk/release || true
            exit 1
          fi
          echo "unsigned_apk=$APK" >> "$GITHUB_OUTPUT"
          echo "Found: $APK"

      - name: Resolve build-tools
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        id: bt
        run: |
          BUILD_TOOLS=$(ls -d "$ANDROID_HOME/build-tools/"* 2>/dev/null | grep -Ev 'rc|alpha|beta' | sort -V | tail -n 1)
          if [ -z "$BUILD_TOOLS" ]; then
            echo "No build-tools found in $ANDROID_HOME"
            find "$ANDROID_HOME" -maxdepth 2 -type d | head -n 40 || true
            exit 1
          fi
          echo "dir=$BUILD_TOOLS" >> "$GITHUB_OUTPUT"
          echo "Using: $BUILD_TOOLS"
          ls "$BUILD_TOOLS" | grep -E 'apksigner|zipalign'

      - name: Zipalign
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        run: |
          "${{ steps.bt.outputs.dir }}/zipalign" -f -p 4 \
            "${{ steps.locate.outputs.unsigned_apk }}" \
            "$RUNNER_TEMP/aligned.apk"

      - name: Sign with v1 + v2 + v3
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          "${{ steps.bt.outputs.dir }}/apksigner" sign \
            --ks "$RUNNER_TEMP/release.jks" \
            --ks-pass "pass:$KEYSTORE_PASSWORD" \
            --ks-key-alias "$KEY_ALIAS" \
            --key-pass "pass:$KEY_PASSWORD" \
            --v1-signing-enabled true \
            --v2-signing-enabled true \
            --v3-signing-enabled true \
            --out "$RUNNER_TEMP/app-release.apk" \
            "$RUNNER_TEMP/aligned.apk"

      - name: Verify signature (v1 + v2 + v3)
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        run: |
          "${{ steps.bt.outputs.dir }}/apksigner" verify --verbose \
            "$RUNNER_TEMP/app-release.apk" | tee verify.txt
          grep -q "Verified using v1 scheme (JAR signing): true" verify.txt
          grep -q "Verified using v2 scheme (APK Signature Scheme v2): true" verify.txt
          grep -q "Verified using v3 scheme (APK Signature Scheme v3): true" verify.txt

      - name: Clean up keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks" "$RUNNER_TEMP/aligned.apk"

      - name: Resolve version tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          elif [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          fi

      - name: Rename APK to release name
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        run: |
          mv "$RUNNER_TEMP/app-release.apk" \
             "$RUNNER_TEMP/SIMNumberSetter-${{ steps.tag.outputs.tag }}.apk"

      - name: Build source archive
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        run: |
          TAG="${{ steps.tag.outputs.tag }}"
          git archive \
            --format=zip \
            --prefix="SIMNumberSetter-${TAG}/" \
            -o "$RUNNER_TEMP/SIMNumberSetter-${TAG}-source.zip" \
            HEAD
          git archive \
            --format=tar.gz \
            --prefix="SIMNumberSetter-${TAG}/" \
            -o "$RUNNER_TEMP/SIMNumberSetter-${TAG}-source.tar.gz" \
            HEAD

      - name: Generate checksums
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        run: |
          TAG="${{ steps.tag.outputs.tag }}"
          cd "$RUNNER_TEMP"
          sha256sum "SIMNumberSetter-${TAG}.apk" \
                    "SIMNumberSetter-${TAG}-source.zip" \
                    "SIMNumberSetter-${TAG}-source.tar.gz" \
                    > "SHA256SUMS.txt"
          cat SHA256SUMS.txt

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: SIMNumberSetter ${{ steps.tag.outputs.tag }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            ${{ runner.temp }}/SIMNumberSetter-${{ steps.tag.outputs.tag }}.apk
            ${{ runner.temp }}/SIMNumberSetter-${{ steps.tag.outputs.tag }}-source.zip
            ${{ runner.temp }}/SIMNumberSetter-${{ steps.tag.outputs.tag }}-source.tar.gz
            ${{ runner.temp }}/SHA256SUMS.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
